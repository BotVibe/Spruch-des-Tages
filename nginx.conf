server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # YouVersion APIs/images are cross-origin, so no COEP/COOP.
    # Referrer-Policy no-referrer is fine: moments/images.youversionapi.com and
    # imageproxy respond 200 without a Referer (checked; CORS allow-origin *).
    add_header X-Content-Type-Options "nosniff"          always;
    add_header Referrer-Policy        "no-referrer"      always;
    # Merge SHA baked in at image build (Dockerfile APP_REVISION) for deploy checks.
    add_header X-App-Revision         "__APP_REVISION__" always;
    add_header Cache-Control          "no-cache"         always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types text/plain text/css application/javascript application/json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No SPA fallback: missing files must 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
